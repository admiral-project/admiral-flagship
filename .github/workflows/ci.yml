name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: pip install .
        name: Install project

      - run: pip install pytest ruff bandit flake8 black
        name: Install test and lint tools

      - run: black --check --diff .
        name: black format check

      - run: ruff check .
        name: ruff check

      - run: flake8 .
        name: flake8

      - run: bandit -r . -ll
        continue-on-error: true
        name: bandit

      - run: npm ci
        name: Install JS devDependencies

      - run: npx eslint .
        continue-on-error: true
        name: eslint

      - run: python -m pytest tests/ -v
        name: pytest

      - run: npm test
        name: Mocha JS tests
